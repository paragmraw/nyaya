[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyaya-chat"
version = "0.1.0"
description = "LangGraph + FastAPI chat backend for nyaya: retrieval-grounded Indian-law assistant backed by NVIDIA Nemotron and the nyaya MCP corpus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "nyaya contributors" }]
keywords = ["langgraph", "fastapi", "indian-law", "mcp", "nvidia", "nemotron"]

dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.2,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langchain-nvidia-ai-endpoints>=1.4,<2",
    "langchain>=1.0,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
]

[project.urls]
Repository = "https://github.com/your-org/nyaya"

[tool.hatch.build.targets.wheel]
packages = ["nyaya_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --tb=short -q"
markers = [
    "integration: requires live NVIDIA API key and a reachable MCP server",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return"]
name: Security

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday 06:00 UTC
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  python-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"

      - name: Export requirements and audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-editable --format requirements-txt > requirements.txt
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-xxxx || true  # advisory for now

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # npm install (not ci) so optional native bindings like
        # @emnapi/* resolve correctly across Linux/macOS/Windows runners.
        run: npm install --no-audit --no-fund

      - name: Audit
        run: npm audit --omit=dev --audit-level=high || true  # advisory for now

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true  # advisory for now

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"  # advisory for now
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
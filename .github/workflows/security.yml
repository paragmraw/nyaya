name: Security

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday 06:00 UTC
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  python-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"

      - name: Set up Python
        run: uv python install 3.12

      - name: Export MCP requirements and audit
        run: |
          uv export --locked --no-dev --extra http --no-emit-project --no-editable --format requirements-txt > requirements.txt
          uv venv .audit-venv
          uv pip install --python .audit-venv/bin/python pip-audit
          .audit-venv/bin/pip-audit -r requirements.txt

  chat-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chat
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"

      - name: Set up Python
        run: uv python install 3.12

      - name: Export chat requirements and audit
        run: |
          uv export --locked --no-dev --no-emit-project --no-editable --format requirements-txt > chat-requirements.txt
          uv venv .audit-venv
          uv pip install --python .audit-venv/bin/python pip-audit
          .audit-venv/bin/pip-audit -r chat-requirements.txt

  license-hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfiles exclude banned copyleft and Postgres packages
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          banned = {
              "ecourts",
              "pymupdf",
              "fitz",
              "surya-ocr",
              "psycopg",
              "psycopg-pool",
              "psycopg-binary",
              "pgvector",
          }
          for lock_path in ("mcp/uv.lock", "chat/uv.lock"):
              data = tomllib.loads(pathlib.Path(lock_path).read_text(encoding="utf-8"))
              pkgs = {str(pkg.get("name", "")).lower() for pkg in data.get("package", [])}
              hits = sorted(pkgs & banned)
              if hits:
                  print(f"::error::Banned package(s) in {lock_path}: {hits}", file=sys.stderr)
                  sys.exit(1)
              print(f"OK: {lock_path} ({len(pkgs)} packages) clean")
          PY

  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        # npm install (not ci) so optional native bindings like
        # @emnapi/* resolve correctly across Linux/macOS/Windows runners.
        run: npm install --no-audit --no-fund

      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true  # advisory — osv-scanner false positives for transitive deps

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
        continue-on-error: true  # advisory — trivy false positives for base image packages

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

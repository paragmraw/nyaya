name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra http --extra ingest --dev

      - name: Install chat sub-app
        run: |
          uv export --project ../chat --locked --no-dev --no-emit-project --no-editable --format requirements-txt > /tmp/chat-requirements.txt
          uv pip install -r /tmp/chat-requirements.txt
          uv pip install --no-deps -e ../chat
          rm -f /tmp/chat-requirements.txt

      - name: Lint MCP (ruff)
        run: uv run ruff check nyaya/ tests/

      - name: Type check MCP (mypy)
        run: uv run mypy nyaya/

      - name: Test MCP with coverage
        # Coverage floor (>= 78%) is enforced across the v2 test suite.
        run: uv run pytest --cov=nyaya --cov-report=term-missing --cov-report=xml --cov-fail-under=78

      - name: Lint chat (ruff)
        run: uv run ruff check ../chat/nyaya_chat/ ../chat/tests/ ../chat/eval/

      - name: Type check chat (mypy)
        run: uv run mypy ../chat/nyaya_chat/

      - name: Test chat with coverage
        # Coverage floor (>= 84%) is enforced across the v2 chat test suite.
        run: uv run pytest ../chat/tests/ -v --cov=nyaya_chat --cov-report=term-missing --cov-fail-under=84
        env:
          NVIDIA_API_KEY: nvapi-test-key-for-ci

      - name: Offline retrieval eval
        run: uv run python ../chat/eval/retrieval_eval.py --fixture tests/fixtures/mini_corpus

      - name: Stdio JSON-RPC pipe smoke test (zero secrets)
        run: |
          DATA_DIR="tests/fixtures/mini_corpus"
          TMP_DATA_DIR=""
          if [ ! -f "$DATA_DIR/nyaya-core.sqlite" ]; then
            TMP_DATA_DIR="$(mktemp -d)"
            uv run --no-sync python -m tests.fixtures.mini_corpus.builder "$TMP_DATA_DIR"
            DATA_DIR="$TMP_DATA_DIR"
          fi
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"2.0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | env -u NVIDIA_API_KEY uv run --no-sync nyaya-mcp --transport stdio --data-dir "$DATA_DIR" --no-download --offline-only \
            | python3 -c "import json, sys; lines = [json.loads(l) for l in sys.stdin if l.strip()]; assert len(lines) >= 2, len(lines); tools = lines[-1]['result']['tools']; assert len(tools) == 12, f'expected 12 tools, got {len(tools)}'"
          [ -n "$TMP_DATA_DIR" ] && rm -rf "$TMP_DATA_DIR" || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: mcp/coverage.xml

      - name: Verify MCP lockfile is up to date
        run: uv lock --check

      - name: Verify chat lockfile is up to date
        # chat/uv.lock pins the image's chat deps (Dockerfile exports it with
        # --locked) and its shared pins are constrained to mcp's — a stale
        # chat lock would fail the docker build, so catch it here first.
        run: uv lock --check
        working-directory: chat

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # Prefer reproducible `npm ci`; fall back to `npm install` when the
        # strict lockfile install fails to resolve optional native bindings
        # (e.g. @emnapi/*) on a given runner OS.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint
        # Next.js 16 removed `next lint`; use ESLint directly with the flat config.
        run: npx eslint .

      - name: Test (node:test via tsx)
        run: npm test

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nyaya-ci .

      - name: Smoke-run hardened image (zero secrets, read-only, 1 GB RAM)
        run: |
          docker volume create nyaya-smoke-cache
          trap 'docker rm -f nyaya-smoke >/dev/null 2>&1 || true; docker volume rm nyaya-smoke-cache >/dev/null 2>&1 || true' EXIT
          docker run -d --name nyaya-smoke \
            --read-only --memory=1g --pids-limit=256 \
            --cap-drop=ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64m --tmpfs /var/tmp:size=32m \
            -v nyaya-smoke-cache:/var/cache/nyaya \
            -e NYAYA_CACHE_DIR=/var/cache/nyaya \
            -p 8000:8000 nyaya-ci

          ready=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "::error::/health never returned 200"
            docker logs nyaya-smoke
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/health | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['status'] == 'healthy', d"
          curl -fsS http://127.0.0.1:8000/api/corpus-status | python3 -c "import json, sys; d = json.load(sys.stdin); assert 'counts' in d, d"
          curl -fsS http://127.0.0.1:8000/api/tools | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['total'] == 12, d"
          mcp_code=$(curl -s -o /tmp/mcp-init.out -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"2.0"}}}')
          echo "POST /mcp initialize -> $mcp_code"
          [ "$mcp_code" = "200" ] || { cat /tmp/mcp-init.out; docker logs nyaya-smoke; exit 1; }

      - name: Trivy image scan
        # Scan the just-verified image; fails the job on HIGH/CRITICAL vulns
        # with a published fix. No secrets or tokens required.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nyaya-ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

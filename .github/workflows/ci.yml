name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install chat sub-app
        run: uv pip install -e ../chat

      - name: Lint (ruff)
        run: uv run ruff check nyaya/ tests/

      - name: Type check (mypy)
        run: uv run mypy nyaya/

      - name: Test MCP with coverage
        # Floor = measured actual at the time of introduction (78.7% on
        # 2026-09-01, 187 tests). Ratchet this up as coverage improves;
        # never lower it.
        run: uv run pytest --cov=nyaya --cov-report=term-missing --cov-report=xml --cov-fail-under=78

      - name: Lint chat (ruff)
        run: uv run ruff check ../chat/nyaya_chat/ ../chat/tests/ ../chat/eval/

      - name: Test chat
        run: uv run pytest ../chat/tests/ -v
        env:
          NVIDIA_API_KEY: nvapi-test-key-for-ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: mcp/coverage.xml

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Verify chat lockfile is up to date
        # chat/uv.lock pins the image's chat deps (Dockerfile exports it with
        # --locked) and its shared pins are constrained to mcp's — a stale
        # chat lock would fail the docker build, so catch it here first.
        run: uv lock --check
        working-directory: chat

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm install (not ci) so optional native bindings like
        # @emnapi/* resolve correctly across Linux/macOS/Windows runners.
        run: npm install --no-audit --no-fund

      - name: Lint
        # Next.js 16 removed `next lint`; use ESLint directly with the flat config.
        run: npx eslint .

      - name: Test (node:test via tsx)
        run: npm test

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nyaya-ci .

      - name: Smoke-run image and check /health
        # A green build is not enough — the plan's only invisibly-breaking
        # item is the runtime image itself. Boot it and hit the healthcheck.
        run: |
          docker run -d --name nyaya-smoke \
            -e DATABASE_URL=postgresql://postgres:pw@localhost:5432/nyaya \
            -e NVIDIA_API_KEY=nvapi-ci-placeholder \
            -p 8000:8000 nyaya-ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$code" = "200" ] && echo "/health -> 200" && exit 0
            sleep 3
          done
          echo "::error::/health never returned 200"; docker logs nyaya-smoke; exit 1

      - name: Trivy image scan
        # Scan the just-verified image; fails the job on HIGH/CRITICAL vulns
        # with a published fix. No secrets or tokens required.
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nyaya-ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

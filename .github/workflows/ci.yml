name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra ingest

      - name: Lint (ruff)
        run: uv run ruff check nyaya/ scripts/ tests/

      - name: Type check (mypy)
        run: uv run mypy nyaya/

      - name: Test with coverage
        run: uv run pytest --cov=nyaya --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: mcp/coverage.xml

      - name: Verify lockfile is up to date
        run: uv lock --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm install (not ci) so optional native bindings like
        # @emnapi/* resolve correctly across Linux/macOS/Windows runners.
        run: npm install --no-audit --no-fund

      - name: Lint
        # Next.js 16 removed `next lint`; use ESLint directly with the flat config.
        run: npx eslint .

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nyaya-ci .
services:
  nyaya:
    build:
      context: .
      # Root Dockerfile builds the Next.js SPA in Node 20 and serves it alongside
      # the Python MCP/REST API, baked SQLite core, and optional chat sub-app from
      # a hardened python:3.12-slim-bookworm container on :8000.
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Disk-backed volume mount (NOT tmpfs — Linux tmpfs counts against mem_limit: 1g).
      - NYAYA_CACHE_DIR=/var/cache/nyaya
      - NYAYA_BUCKET_ENDPOINT=${NYAYA_BUCKET_ENDPOINT:-}
      - NYAYA_BUCKET_NAME=${NYAYA_BUCKET_NAME:-}
      - NYAYA_BUCKET_ACCESS_KEY_ID=${NYAYA_BUCKET_ACCESS_KEY_ID:-}
      - NYAYA_BUCKET_SECRET_ACCESS_KEY=${NYAYA_BUCKET_SECRET_ACCESS_KEY:-}
      - NYAYA_BUCKET_REGION=${NYAYA_BUCKET_REGION:-auto}
      - NYAYA_BUCKET_URL_STYLE=${NYAYA_BUCKET_URL_STYLE:-vhost}
      - NYAYA_COMMERCIAL_SAFE_ONLY=${NYAYA_COMMERCIAL_SAFE_ONLY:-false}
      - NYAYA_OFFLINE_ONLY=${NYAYA_OFFLINE_ONLY:-false}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    restart: unless-stopped
    # Hardening: read-only root, no-new-privileges, drop all caps, cap PIDs/mem.
    read_only: true
    volumes:
      - nyaya_cache:/var/cache/nyaya
    tmpfs:
      - /tmp:size=64m
      - /var/tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nyaya_cache:

services:
  nyaya:
    build:
      context: .
      # Root Dockerfile builds the Next.js SPA in a Node stage and serves it
      # alongside the Python MCP/REST API and the chat sub-app from a single
      # Alpine runtime on :8000. Same image Railway deploys from (see
      # .railway/railway.ts).
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    restart: unless-stopped
    # Hardening: read-only root, no-new-privileges, drop all caps, cap PIDs/mem.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/tmp:size=32m
      - /app/.cache:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
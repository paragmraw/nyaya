[build]
# Multi-stage root Dockerfile: builds the Next.js SPA (Node stage) and the
# Python MCP server (Alpine stage), then serves both from one container.
# The build context is the repo root.
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck: poll /health on the internal port.
healthcheckPath = "/health"
healthcheckTimeout = 10
healthcheckInterval = 30

# Single replica is plenty for v1. The server is stateless (stateless_http=True),
# so this can be scaled up later without code changes.
replicas = 1

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
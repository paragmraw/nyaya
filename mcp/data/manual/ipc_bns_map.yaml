# Manual mapping between IPC (1860) and BNS (2023) sections.
# The 2023 Bharatiya Nyaya Sanhita replaced the Indian Penal Code. This table
# captures the correspondence so the cross_reference tool can answer queries
# like "what replaced IPC 302?" and "what was BNS 103 in the IPC?".
#
# Source: PRS comparison documents and the BNS bill's statement of objects.
# `kind` is "corresponds_to" by default; use "repeals" where the IPC section
# was dropped rather than re-enacted.
#
# This is a curated list covering the most-referenced sections. Sections not
# listed here will still be discoverable via the text-scan cross-references
# (build_cross_refs._scan_text_refs).


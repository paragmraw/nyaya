schema_version: 2
act_id: "cpc-1908"
act_short: "CPC"
schedule: "First Schedule"
source_id: "indiacode_central_acts"
updated_at: "2026-11-26"

rules:
  - doc_id: "cpc-1908:O1-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "1"
    order_roman: "I"
    order_title: "Parties to Suits"
    rule_number: "1"
    ref: "Order 1 Rule 1"
    ref_norm: "O1-R1"
    title: "Who may be joined as plaintiffs"
    text: "All persons may be joined in one suit as plaintiffs where any right to relief in respect of, or arising out of, the same act or transaction or series of acts or transactions is alleged to exist in such persons, whether jointly, severally or in the alternative; and if such persons brought separate suits, any common question of law or fact would arise."
    status: "in_force"

  - doc_id: "cpc-1908:O1-R10"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "1"
    order_roman: "I"
    order_title: "Parties to Suits"
    rule_number: "10"
    ref: "Order 1 Rule 10"
    ref_norm: "O1-R10"
    title: "Suit in name of wrong plaintiff; Court may strike out or add parties"
    text: "(1) Where a suit has been instituted in the name of the wrong person as plaintiff or where it is doubtful whether it has been instituted in the name of the right plaintiff, the Court may at any stage of the suit, if satisfied that the suit has been instituted through a bona fide mistake, order any other person to be substituted or added as plaintiff. (2) The Court may at any stage of the proceedings, either upon or without the application of either party, order that the name of any party improperly joined be struck out, and that the name of any necessary or proper party be added."
    status: "in_force"

  - doc_id: "cpc-1908:O2-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "2"
    order_roman: "II"
    order_title: "Frame of Suit"
    rule_number: "2"
    ref: "Order 2 Rule 2"
    ref_norm: "O2-R2"
    title: "Suit to include the whole claim"
    text: "(1) Every suit shall include the whole of the claim which the plaintiff is entitled to make in respect of the cause of action; but a plaintiff may relinquish any portion of his claim in order to bring the suit within the jurisdiction of any Court. (2) Where a plaintiff omits to sue in respect of, or intentionally relinquishes, any portion of his claim, he shall not afterwards sue in respect of the portion so omitted or relinquished. (3) A person entitled to more than one relief in respect of the same cause of action may sue for all or any of such reliefs; but if he omits, except with the leave of the Court, to sue for all such reliefs, he shall not afterwards sue for any relief so omitted."
    status: "in_force"

  - doc_id: "cpc-1908:O3-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "3"
    order_roman: "III"
    order_title: "Recognized Agents and Pleaders"
    rule_number: "1"
    ref: "Order 3 Rule 1"
    ref_norm: "O3-R1"
    title: "Appearances, etc., may be in person, by recognized agent or by pleader"
    text: "Any appearance, application or act in or to any Court, required or authorized by law to be made or done by a party in such Court, may, except where otherwise expressly provided by any law for the time being in force, be made or done by the party in person, or by his recognized agent, or by a pleader appearing, applying or acting on his behalf."
    status: "in_force"

  - doc_id: "cpc-1908:O4-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "4"
    order_roman: "IV"
    order_title: "Institution of Suits"
    rule_number: "1"
    ref: "Order 4 Rule 1"
    ref_norm: "O4-R1"
    title: "Suit to be commenced by plaint"
    text: "(1) Every suit shall be instituted by presenting a plaint in duplicate to the Court or such officer as it appoints in this behalf. (2) Every plaint shall comply with the rules contained in Orders VI and VII, so far as they are applicable. (3) The plaint shall not be deemed to be duly instituted unless it complies with the requirements specified in sub-rules (1) and (2)."
    status: "in_force"

  - doc_id: "cpc-1908:O5-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "5"
    order_roman: "V"
    order_title: "Issue and Service of Summons"
    rule_number: "1"
    ref: "Order 5 Rule 1"
    ref_norm: "O5-R1"
    title: "Summons"
    text: "(1) When a suit has been duly instituted, a summons may be issued to the defendant to appear and answer the claim and to file the written statement of his defence, if any, within thirty days from the date of service of summons on that defendant: Provided that no such summons shall be issued when a defendant has appeared at the presentation of plaint and admitted the plaintiff's claim. Where the defendant fails to file the written statement within thirty days, he shall be allowed to file the same on such other day as may be specified by the Court for reasons to be recorded in writing, but not later than ninety days from the date of service of summons (or 120 days in commercial suits)."
    status: "in_force"

  - doc_id: "cpc-1908:O5-R20"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "5"
    order_roman: "V"
    order_title: "Issue and Service of Summons"
    rule_number: "20"
    ref: "Order 5 Rule 20"
    ref_norm: "O5-R20"
    title: "Substituted service"
    text: "(1) Where the Court is satisfied that there is reason to believe that the defendant is keeping out of the way for the purpose of avoiding service, or that for any other reason the summons cannot be served in the ordinary way, the Court shall order the summons to be served by affixing a copy thereof in some conspicuous place in the Court-house and upon some conspicuous part of the house in which the defendant is known to have last resided or carried on business, or in such other manner as the Court thinks fit, including advertisement in a daily newspaper circulating in the locality."
    status: "in_force"

  - doc_id: "cpc-1908:O6-R17"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "6"
    order_roman: "VI"
    order_title: "Pleadings Generally"
    rule_number: "17"
    ref: "Order 6 Rule 17"
    ref_norm: "O6-R17"
    title: "Amendment of pleadings"
    text: "The Court may at any stage of the proceedings allow either party to alter or amend his pleadings in such manner and on such terms as may be just, and all such amendments shall be made as may be necessary for the purpose of determining the real questions in controversy between the parties: Provided that no application for amendment shall be allowed after the trial has commenced, unless the Court comes to the conclusion that in spite of due diligence, the party could not have raised the matter before the commencement of trial."
    status: "in_force"

  - doc_id: "cpc-1908:O7-R10"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "7"
    order_roman: "VII"
    order_title: "Plaint"
    rule_number: "10"
    ref: "Order 7 Rule 10"
    ref_norm: "O7-R10"
    title: "Return of plaint"
    text: "(1) Subject to the provisions of rule 10A, the plaint shall at any stage of the suit be returned to be presented to the Court in which the suit should have been instituted. (2) On returning a plaint, the Judge shall endorse thereon the date of its presentation and return, the name of the party presenting it, and a brief statement of the reasons for returning it."
    status: "in_force"

  - doc_id: "cpc-1908:O7-R11"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "7"
    order_roman: "VII"
    order_title: "Plaint"
    rule_number: "11"
    ref: "Order 7 Rule 11"
    ref_norm: "O7-R11"
    title: "Rejection of plaint"
    text: "The plaint shall be rejected in the following cases: (a) where it does not disclose a cause of action; (b) where the relief claimed is undervalued and the plaintiff fails to correct valuation within the time fixed; (c) where the plaint is insufficiently stamped and the plaintiff fails to supply the requisite stamp-paper within the time fixed; (d) where the suit appears from the statement in the plaint to be barred by any law; (e) where it is not filed in duplicate; (f) where the plaintiff fails to comply with the provisions of rule 9."
    status: "in_force"

  - doc_id: "cpc-1908:O8-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "8"
    order_roman: "VIII"
    order_title: "Written Statement, Set-Off and Counter-Claim"
    rule_number: "1"
    ref: "Order 8 Rule 1"
    ref_norm: "O8-R1"
    title: "Written statement"
    text: "The defendant shall, within thirty days from the date of service of summons on him, present a written statement of his defence: Provided that where the defendant fails to file the written statement within the said period of thirty days, he shall be allowed to file the same on such other day, as may be specified by the Court, for reasons to be recorded in writing, but which shall not be later than ninety days from the date of service of summons (or mandatory 120-day outer limit in Commercial Courts disputes)."
    status: "in_force"

  - doc_id: "cpc-1908:O8-R6A"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "8"
    order_roman: "VIII"
    order_title: "Written Statement, Set-Off and Counter-Claim"
    rule_number: "6A"
    ref: "Order 8 Rule 6A"
    ref_norm: "O8-R6A"
    title: "Counter-claim by defendant"
    text: "(1) A defendant in a suit may, in addition to his right of pleading a set-off under rule 6, set up, by way of counter-claim against the claim of the plaintiff, any right or claim in respect of a cause of action accruing to the defendant against the plaintiff either before or after the filing of the suit but before the defendant has delivered his defence or before the time limited for delivering his defence has expired, provided that such counter-claim shall not exceed the pecuniary limits of the jurisdiction of the Court."
    status: "in_force"

  - doc_id: "cpc-1908:O8A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "8A"
    order_roman: "VIII-A"
    order_title: "Third-Party Procedure"
    rule_number: "1"
    ref: "Order 8A Rule 1"
    ref_norm: "O8A-R1"
    title: "Third-party notice where defendant claims contribution or indemnity"
    text: "Where a defendant claims to be entitled to contribution from or indemnity against any person not already a party to the suit, he may, by leave of the Court, issue a third-party notice to that effect so that questions of liability between the defendant and the third party may be determined in the same proceeding."
    status: "in_force"

  - doc_id: "cpc-1908:O9-R13"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "9"
    order_roman: "IX"
    order_title: "Appearance of Parties and Consequence of Non-Appearance"
    rule_number: "13"
    ref: "Order 9 Rule 13"
    ref_norm: "O9-R13"
    title: "Setting aside decree ex parte against defendant"
    text: "In any case in which a decree is passed ex parte against a defendant, he may apply to the Court by which the decree was passed for an order to set it aside; and if he satisfies the Court that the summons was not duly served, or that he was prevented by any sufficient cause from appearing when the suit was called on for hearing, the Court shall make an order setting aside the decree as against him upon such terms as to costs, payment into Court or otherwise as it thinks fit."
    status: "in_force"

  - doc_id: "cpc-1908:O10-R1A"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "10"
    order_roman: "X"
    order_title: "Examination of Parties by the Court"
    rule_number: "1A"
    ref: "Order 10 Rule 1A"
    ref_norm: "O10-R1A"
    title: "Direction of the court to opt for any one mode of alternative dispute resolution"
    text: "After recording the admissions and denials, the Court shall direct the parties to the suit to opt either mode of the settlement outside the Court as specified in sub-section (1) of section 89. On the option of the parties, the Court shall fix the date of appearance before such forum or authority as may be opted by the parties."
    status: "in_force"

  - doc_id: "cpc-1908:O11-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "11"
    order_roman: "XI"
    order_title: "Discovery and Inspection"
    rule_number: "1"
    ref: "Order 11 Rule 1"
    ref_norm: "O11-R1"
    title: "Discovery by interrogatories"
    text: "In any suit the plaintiff or defendant by leave of the Court may deliver interrogatories in writing for the examination of the opposite parties, or any one or more of such parties, and such interrogatories when delivered shall have a note at the foot thereof stating which of such interrogatories each of such persons is required to answer: Provided that no party shall deliver more than one set of interrogatories to the same party without an order for that purpose."
    status: "in_force"

  - doc_id: "cpc-1908:O12-R6"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "12"
    order_roman: "XII"
    order_title: "Admissions"
    rule_number: "6"
    ref: "Order 12 Rule 6"
    ref_norm: "O12-R6"
    title: "Judgment on admissions"
    text: "(1) Where admissions of fact have been made either in the pleading or otherwise, whether orally or in writing, the Court may at any stage of the suit, either on the application of any party or of its own motion and without waiting for the determination of any other question between the parties, make such order or give such judgment as it may think fit, having regard to such admissions. (2) Whenever a judgment is pronounced under sub-rule (1) a decree shall be drawn up in accordance with the judgment."
    status: "in_force"

  - doc_id: "cpc-1908:O13-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "13"
    order_roman: "XIII"
    order_title: "Production, Impounding and Return of Documents"
    rule_number: "1"
    ref: "Order 13 Rule 1"
    ref_norm: "O13-R1"
    title: "Original documents to be produced at or before the settlement of issues"
    text: "(1) The parties or their pleader shall produce on or before the settlement of issues, all the documentary evidence in original where the copies thereof have been filed along with plaint or written statement. (2) The Court shall receive the documents so produced provided they are accompanied by an accurate list thereof prepared in such form as the High Court directs."
    status: "in_force"

  - doc_id: "cpc-1908:O13A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "13A"
    order_roman: "XIII-A"
    order_title: "Summary Judgment"
    rule_number: "1"
    ref: "Order 13A Rule 1"
    ref_norm: "O13A-R1"
    title: "Scope of and classes of suits to which Order XIII-A applies (Commercial Courts)"
    text: "Inserted by the Commercial Courts Act, 2015, Order XIII-A sets out the procedure by which Courts may decide a claim pertaining to any Commercial Dispute without recording oral evidence where the plaintiff or defendant has no real prospect of succeeding on or defending the claim and there is no other compelling reason why the claim should not be disposed of before recording oral evidence."
    status: "in_force"

  - doc_id: "cpc-1908:O14-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "14"
    order_roman: "XIV"
    order_title: "Settlement of Issues and Determination of Suit on Issues of Law or on Issues agreed upon"
    rule_number: "1"
    ref: "Order 14 Rule 1"
    ref_norm: "O14-R1"
    title: "Framing of issues"
    text: "(1) Issues arise when a material proposition of fact or law is affirmed by the one party and denied by the other. (2) Material propositions are those propositions of law or fact which a plaintiff must allege in order to show a right to sue or a defendant must allege in order to constitute his defence. (3) Each material proposition affirmed by one party and denied by the other shall form the subject of a distinct issue. (4) Issues are of two kinds: (a) issues of fact, (b) issues of law."
    status: "in_force"

  - doc_id: "cpc-1908:O14-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "14"
    order_roman: "XIV"
    order_title: "Settlement of Issues and Determination of Suit on Issues of Law or on Issues agreed upon"
    rule_number: "2"
    ref: "Order 14 Rule 2"
    ref_norm: "O14-R2"
    title: "Court to pronounce judgment on all issues"
    text: "(1) Notwithstanding that a case may be disposed of on a preliminary issue, the Court shall, subject to the provisions of sub-rule (2), pronounce judgment on all issues. (2) Where issues both of law and of fact arise in the same suit, and the Court is of opinion that the case or any part thereof may be disposed of on an issue of law only, it may try that issue first if that issue relates to (a) the jurisdiction of the Court, or (b) a bar to the suit created by any law for the time being in force."
    status: "in_force"

  - doc_id: "cpc-1908:O15-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "15"
    order_roman: "XV"
    order_title: "Disposal of the Suit at the First Hearing"
    rule_number: "1"
    ref: "Order 15 Rule 1"
    ref_norm: "O15-R1"
    title: "Parties not at issue"
    text: "Where at the first hearing of a suit it appears that the parties are not at issue on any question of law or of fact, the Court may at once pronounce judgment."
    status: "in_force"

  - doc_id: "cpc-1908:O15A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "15A"
    order_roman: "XV-A"
    order_title: "Case Management Hearing"
    rule_number: "1"
    ref: "Order 15A Rule 1"
    ref_norm: "O15A-R1"
    title: "First Case Management Hearing (Commercial Courts)"
    text: "Inserted by the Commercial Courts Act, 2015, the Court shall hold the first Case Management Hearing not later than four weeks from the date of filing of affidavit of admission or denial of documents by all parties to the suit, to frame issues, list witnesses, fix dates for filing evidence affidavits, cross-examination, and final oral arguments."
    status: "in_force"

  - doc_id: "cpc-1908:O16-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "16"
    order_roman: "XVI"
    order_title: "Summoning and Attendance of Witnesses"
    rule_number: "1"
    ref: "Order 16 Rule 1"
    ref_norm: "O16-R1"
    title: "List of witnesses and summons to witnesses"
    text: "On or before such date as the Court may appoint, and not later than fifteen days after the date on which the issues are settled, the parties shall present in Court a list of witnesses whom they propose to call either to give evidence or to produce documents and obtain summonses to such persons for their attendance in Court."
    status: "in_force"

  - doc_id: "cpc-1908:O16A-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "16A"
    order_roman: "XVI-A"
    order_title: "Attendance of Witnesses Confined or Detained in Prisons"
    rule_number: "2"
    ref: "Order 16A Rule 2"
    ref_norm: "O16A-R2"
    title: "Power to require attendance of prisoners to give evidence"
    text: "Where it appears to a Court that the evidence of a person confined or detained in a prison within the State is material in a suit, the Court may make an order requiring the officer in charge of the prison to produce that person before the Court to give evidence, subject to distance and commission safeguards."
    status: "in_force"

  - doc_id: "cpc-1908:O17-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "17"
    order_roman: "XVII"
    order_title: "Adjournments"
    rule_number: "1"
    ref: "Order 17 Rule 1"
    ref_norm: "O17-R1"
    title: "Court may grant time and adjourn hearing"
    text: "(1) The Court may, if sufficient cause is shown, at any stage of the suit grant time to the parties or to any of them, and may from time to time adjourn the hearing of the suit for reasons to be recorded in writing: Provided that no such adjournment shall be granted more than three times to a party during hearing of the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O18-R4"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "18"
    order_roman: "XVIII"
    order_title: "Hearing of the Suit and Examination of Witnesses"
    rule_number: "4"
    ref: "Order 18 Rule 4"
    ref_norm: "O18-R4"
    title: "Recording of evidence"
    text: "(1) In every case, the examination-in-chief of a witness shall be on affidavit and copies thereof shall be supplied to the opposite party by the party who calls him for evidence: Provided that where documents are filed and the parties rely upon the documents, the proof and admissibility of such documents which are filed along with affidavit shall be subject to the orders of the Court. (2) The evidence (cross-examination and re-examination) of the witness in attendance, whose evidence (examination-in-chief) by affidavit has been furnished to the Court, shall be taken either by the Court or by the Commissioner appointed by it."
    status: "in_force"

  - doc_id: "cpc-1908:O19-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "19"
    order_roman: "XIX"
    order_title: "Affidavits"
    rule_number: "1"
    ref: "Order 19 Rule 1"
    ref_norm: "O19-R1"
    title: "Power to order any point to be proved by affidavit"
    text: "Any Court may at any time for sufficient reason order that any particular fact or facts may be proved by affidavit, or that the affidavit of any witness may be read at the hearing, on such conditions as the Court thinks reasonable: Provided that where it appears to the Court that either party bona fide desires the production of a witness for cross-examination, and that such witness can be produced, an order shall not be made authorizing the evidence of such witness to be given by affidavit."
    status: "in_force"

  - doc_id: "cpc-1908:O20-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "20"
    order_roman: "XX"
    order_title: "Judgment and Decree"
    rule_number: "1"
    ref: "Order 20 Rule 1"
    ref_norm: "O20-R1"
    title: "Judgment when pronounced"
    text: "(1) The Court, after the case has been heard, shall pronounce judgment in an open Court, either at once, or as soon thereafter as may be practicable and when the judgment is to be pronounced on some future day, the Court shall fix a day for that purpose, of which due notice shall be given to the parties or their pleaders: Provided that where the judgment is not pronounced at once, every endeavour shall be made by the Court to pronounce the judgment within thirty days from the date on which the hearing of the case was concluded, and where it is not practicable so to do on the ground of exceptional and extraordinary circumstances, the Court shall fix a future day not beyond sixty days."
    status: "in_force"

  - doc_id: "cpc-1908:O20A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "20A"
    order_roman: "XX-A"
    order_title: "Costs"
    rule_number: "1"
    ref: "Order 20A Rule 1"
    ref_norm: "O20A-R1"
    title: "Provisions relating to certain items of costs"
    text: "Without prejudice to the generality of the provisions of this Code relating to costs, the Court may award costs in respect of expenditure incurred for giving statutory notices, typing/writing/printing of pleadings, inspection of Court records, production of witnesses not summoned through Court, and obtaining copies of judgments and decrees."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "1"
    ref: "Order 21 Rule 1"
    ref_norm: "O21-R1"
    title: "Modes of paying money under decree"
    text: "(1) All money, payable under a decree shall be paid as follows, namely: (a) by deposit into the Court whose duty it is to execute the decree, or sent to that Court by postal money order or through a bank; or (b) out of Court, to the decree-holder by postal money order or through a bank or by any other mode wherein payment is evidenced in writing; or (c) otherwise, as the Court which made the decree, directs."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R97"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "97"
    ref: "Order 21 Rule 97"
    ref_norm: "O21-R97"
    title: "Resistance or obstruction to possession of immovable property"
    text: "(1) Where the holder of a decree for the possession of immovable property or the purchaser of any such property sold in execution of a decree is resisted or obstructed by any person in obtaining possession of the property, he may make an application to the Court complaining of such resistance or obstruction. (2) Where any application is made under sub-rule (1), the Court shall proceed to adjudicate upon the application in accordance with the provisions herein contained (rules 98-103)."
    status: "in_force"

  - doc_id: "cpc-1908:O22-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "22"
    order_roman: "XXII"
    order_title: "Death, Marriage and Insolvency of Parties"
    rule_number: "3"
    ref: "Order 22 Rule 3"
    ref_norm: "O22-R3"
    title: "Procedure in case of death of one of several plaintiffs or of sole plaintiff"
    text: "(1) Where one of two or more plaintiffs dies and the right to sue does not survive to the surviving plaintiff or plaintiffs alone, or a sole plaintiff or sole surviving plaintiff dies and the right to sue survives, the Court, on an application made in that behalf, shall cause the legal representative of the deceased plaintiff to be made a party and shall proceed with the suit. (2) Where within the time limited by law no application is made under sub-rule (1), the suit shall abate so far as the deceased plaintiff is concerned."
    status: "in_force"

  - doc_id: "cpc-1908:O22-R4"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "22"
    order_roman: "XXII"
    order_title: "Death, Marriage and Insolvency of Parties"
    rule_number: "4"
    ref: "Order 22 Rule 4"
    ref_norm: "O22-R4"
    title: "Procedure in case of death of one of several defendants or of sole defendant"
    text: "(1) Where one of two or more defendants dies and the right to sue does not survive against the surviving defendant or defendants alone, or a sole defendant or sole surviving defendant dies and the right to sue survives, the Court, on an application made in that behalf, shall cause the legal representative of the deceased defendant to be made a party and shall proceed with the suit. (3) Where within the time limited by law no application is made under sub-rule (1), the suit shall abate as against the deceased defendant."
    status: "in_force"

  - doc_id: "cpc-1908:O23-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "23"
    order_roman: "XXIII"
    order_title: "Withdrawal and Adjustment of Suits"
    rule_number: "1"
    ref: "Order 23 Rule 1"
    ref_norm: "O23-R1"
    title: "Withdrawal of suit or abandonment of part of claim"
    text: "(1) At any time after the institution of a suit, the plaintiff may as against all or any of the defendants abandon his suit or abandon a part of his claim. (3) Where the Court is satisfied (a) that a suit must fail by reason of some formal defect, or (b) that there are sufficient grounds for allowing the plaintiff to institute a fresh suit for the subject-matter of a suit or part of a claim, it may grant the plaintiff permission to withdraw from such suit or such part of the claim with liberty to institute a fresh suit."
    status: "in_force"

  - doc_id: "cpc-1908:O23-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "23"
    order_roman: "XXIII"
    order_title: "Withdrawal and Adjustment of Suits"
    rule_number: "3"
    ref: "Order 23 Rule 3"
    ref_norm: "O23-R3"
    title: "Compromise of suit"
    text: "Where it is proved to the satisfaction of the Court that a suit has been adjusted wholly or in part by any lawful agreement or compromise in writing and signed by the parties or where the defendant satisfies the plaintiff in respect of the whole or any part of the subject-matter of the suit, the Court shall order such agreement, compromise or satisfaction to be recorded, and shall pass a decree in accordance therewith so far as it relates to the parties to the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O24-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "24"
    order_roman: "XXIV"
    order_title: "Payment into Court"
    rule_number: "1"
    ref: "Order 24 Rule 1"
    ref_norm: "O24-R1"
    title: "Deposit by defendant of amount in satisfaction of claim"
    text: "The defendant in any suit to recover a debt or damages may, at any stage of the suit, deposit in Court such sum of money as he considers a satisfaction in full of the claim."
    status: "in_force"

  - doc_id: "cpc-1908:O25-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "25"
    order_roman: "XXV"
    order_title: "Security for Costs"
    rule_number: "1"
    ref: "Order 25 Rule 1"
    ref_norm: "O25-R1"
    title: "When security for costs may be required from plaintiff"
    text: "At any stage of a suit, the Court may, either of its own motion or on the application of any defendant, order the plaintiff, for reasons to be recorded, to give within the time fixed by it security for the payment of all costs incurred and likely to be incurred by any defendant, particularly where the plaintiff resides out of India and does not possess sufficient immovable property within India."
    status: "in_force"

  - doc_id: "cpc-1908:O26-R9"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "26"
    order_roman: "XXVI"
    order_title: "Commissions"
    rule_number: "9"
    ref: "Order 26 Rule 9"
    ref_norm: "O26-R9"
    title: "Commissions to make local investigations"
    text: "In any suit in which the Court deems a local investigation to be requisite or proper for the purpose of elucidating any matter in dispute, or of ascertaining the market-value of any property, or the amount of any mesne profits or damages or annual net profits, the Court may issue a commission to such person as it thinks fit directing him to make such investigation and to report thereon to the Court."
    status: "in_force"

  - doc_id: "cpc-1908:O27-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "27"
    order_roman: "XXVII"
    order_title: "Suits by or against the Government or Public Officers in their Official Capacity"
    rule_number: "1"
    ref: "Order 27 Rule 1"
    ref_norm: "O27-R1"
    title: "Suits by or against Government"
    text: "In any suit by or against the Government, the plaint or written statement shall be signed by such person as the Government may, by general or special order, appoint in this behalf, and shall be verified by any person whom the Government may so appoint and who is acquainted with the facts of the case."
    status: "in_force"

  - doc_id: "cpc-1908:O27A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "27A"
    order_roman: "XXVII-A"
    order_title: "Suits Involving a Substantial Question of Law as to the Interpretation of the Constitution or as to the Validity of any Statutory Instrument"
    rule_number: "1"
    ref: "Order 27A Rule 1"
    ref_norm: "O27A-R1"
    title: "Notice to the Attorney General or the Advocate-General"
    text: "In any suit in which it appears to the Court that any such question as is referred to in clause (1) of article 132, read with article 147 of the Constitution, is involved, the Court shall not proceed to determine that question until after notice has been given to the Attorney General for India if the question of law concerns the Central Government and to the Advocate-General of the State if the question of law concerns a State Government."
    status: "in_force"

  - doc_id: "cpc-1908:O28-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "28"
    order_roman: "XXVIII"
    order_title: "Suits by or against Military or Naval Men or Airmen"
    rule_number: "1"
    ref: "Order 28 Rule 1"
    ref_norm: "O28-R1"
    title: "Officers, soldiers, sailors or airmen who cannot obtain leave may authorize any person to sue or defend for them"
    text: "Where any officer, soldier, sailor or airman actually serving under the Government in such capacity is a party to a suit, and cannot obtain leave of absence for the purpose of prosecuting or defending the suit in person, he may authorize any person to sue or defend in his stead by written authority signed and countersigned by his Commanding Officer."
    status: "in_force"

  - doc_id: "cpc-1908:O29-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "29"
    order_roman: "XXIX"
    order_title: "Suits by or against Corporations"
    rule_number: "1"
    ref: "Order 29 Rule 1"
    ref_norm: "O29-R1"
    title: "Subscription and verification of pleading"
    text: "In suits by or against a corporation, any pleading may be signed and verified on behalf of the corporation by the secretary or by any director or other principal officer of the corporation who is able to depose to the facts of the case."
    status: "in_force"

  - doc_id: "cpc-1908:O30-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "30"
    order_roman: "XXX"
    order_title: "Suits by or against Firms and Persons Carrying on Business in Names other than their own"
    rule_number: "1"
    ref: "Order 30 Rule 1"
    ref_norm: "O30-R1"
    title: "Suing of partners in name of firm"
    text: "Any two or more persons claiming or being liable as partners and carrying on business in India may sue or be sued in the name of the firm (if any) of which such persons were partners at the time of the accruing of the cause of action, and any party to a suit may apply to the Court for a statement of the names and addresses of the partners."
    status: "in_force"

  - doc_id: "cpc-1908:O31-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "31"
    order_roman: "XXXI"
    order_title: "Suits by or against Trustees, Executors and Administrators"
    rule_number: "1"
    ref: "Order 31 Rule 1"
    ref_norm: "O31-R1"
    title: "Representation of beneficiaries in suits concerning property vested in trustees, etc."
    text: "In all suits concerning property vested in a trustee, executor or administrator, where the contention is between the persons beneficially interested in such property and a third person, the trustee, executor or administrator shall represent the persons so interested, and it shall not ordinarily be necessary to make them parties to the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O32-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "32"
    order_roman: "XXXII"
    order_title: "Suits by or against Minors and Persons of Unsound Mind"
    rule_number: "1"
    ref: "Order 32 Rule 1"
    ref_norm: "O32-R1"
    title: "Minor to sue by next friend"
    text: "Every suit by a minor shall be instituted in his name by a person who in such suit shall be called the next friend of the minor. Explanation: 'Minor' means a person who has not attained his majority within the meaning of section 3 of the Indian Majority Act, 1875 where the suit relates to any of the matters mentioned in clauses (a) and (b) of section 2 of that Act or to any other matter."
    status: "in_force"

  - doc_id: "cpc-1908:O32-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "32"
    order_roman: "XXXII"
    order_title: "Suits by or against Minors and Persons of Unsound Mind"
    rule_number: "3"
    ref: "Order 32 Rule 3"
    ref_norm: "O32-R3"
    title: "Guardian for the suit to be appointed by Court for minor defendant"
    text: "Where the defendant is a minor, the Court, on being satisfied of the fact of his minority, shall appoint a proper person to be guardian for the suit for such minor, and no decree against a minor without appointing a guardian ad litem or without Court leave for compromise under rule 7 shall bind the minor."
    status: "in_force"

  - doc_id: "cpc-1908:O32A-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "32A"
    order_roman: "XXXII-A"
    order_title: "Suits Relating to Matters Concerning the Family"
    rule_number: "1"
    ref: "Order 32A Rule 1"
    ref_norm: "O32A-R1"
    title: "Application of Order"
    text: "(1) The provisions of this Order shall apply to suits or proceedings relating to matters concerning the family (matrimonial, guardianship, custody, maintenance, validity of marriage, wills/intestacy). (2) Under rules 2 and 3, proceedings may be held in camera and the Court shall make every endeavour to assist the parties in arriving at a settlement."
    status: "in_force"

  - doc_id: "cpc-1908:O33-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "33"
    order_roman: "XXXIII"
    order_title: "Suits by Indigent Persons"
    rule_number: "1"
    ref: "Order 33 Rule 1"
    ref_norm: "O33-R1"
    title: "Suits may be instituted by indigent person"
    text: "Subject to the following provisions, any suit may be instituted by an indigent person. Explanation I: A person is an indigent person if he is not possessed of sufficient means (other than property exempt from attachment in execution of a decree and the subject-matter of the suit) to enable him to pay the fee prescribed by law for the plaint in such suit, or where no such fee is prescribed, if he is not entitled to property worth one thousand rupees other than the property exempt from attachment and the subject-matter of the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O34-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "34"
    order_roman: "XXXIV"
    order_title: "Suits Relating to Mortgages of Immovable Property"
    rule_number: "1"
    ref: "Order 34 Rule 1"
    ref_norm: "O34-R1"
    title: "Parties to suits for foreclosure, sale and redemption"
    text: "Subject to the provisions of this Code, all persons having an interest either in the mortgage-security or in the right of redemption shall be joined as parties to any suit relating to the mortgage, and the Court shall pass preliminary and final decrees in accordance with rules 2 to 8."
    status: "in_force"

  - doc_id: "cpc-1908:O35-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "35"
    order_roman: "XXXV"
    order_title: "Interpleader"
    rule_number: "1"
    ref: "Order 35 Rule 1"
    ref_norm: "O35-R1"
    title: "Plaint in interpleader-suit"
    text: "In every suit of interpleader the plaint shall, in addition to the other statements necessary for plaints, state that the plaintiff claims no interest in the subject-matter in dispute other than for charges or costs, the claims made by the defendants severally, and that there is no collusion between the plaintiff and any of the defendants."
    status: "in_force"

  - doc_id: "cpc-1908:O36-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "36"
    order_roman: "XXXVI"
    order_title: "Special Case"
    rule_number: "1"
    ref: "Order 36 Rule 1"
    ref_norm: "O36-R1"
    title: "Power to state case for Court's opinion"
    text: "Parties claiming to be interested in the decision of any question of fact or law may enter into an agreement in writing stating such question in the form of a case for the opinion of the Court, and providing that, upon the finding of the Court with respect to such question, a sum of money or property shall be paid or delivered or an act done or refrained from."
    status: "in_force"

  - doc_id: "cpc-1908:O37-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "37"
    order_roman: "XXXVII"
    order_title: "Summary Procedure"
    rule_number: "1"
    ref: "Order 37 Rule 1"
    ref_norm: "O37-R1"
    title: "Courts and classes of suits to which the Order is to apply"
    text: "(1) This Order shall apply to High Courts, City Civil Courts, Courts of Small Causes and other Courts. (2) Subject to the provisions of sub-rule (1), the Order applies to the following classes of suits, namely: (a) suits upon bills of exchange, hundies and promissory notes; (b) suits in which the plaintiff seeks only to recover a debt or liquidated demand in money payable by the defendant, with or without interest, arising on a written contract, or on an enactment where the sum sought to be recovered is a fixed sum of money or in the nature of a debt other than a penalty, or on a guarantee where the claim against the principal is in respect of a debt or liquidated demand only."
    status: "in_force"

  - doc_id: "cpc-1908:O37-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "37"
    order_roman: "XXXVII"
    order_title: "Summary Procedure"
    rule_number: "3"
    ref: "Order 37 Rule 3"
    ref_norm: "O37-R3"
    title: "Procedure for the appearance of defendant and leave to defend"
    text: "The defendant shall not defend the suit unless he enters an appearance within ten days of service of summons and, upon service of summons for judgment, applies for leave to defend within ten days showing a substantial defence or triable issue; leave to defend shall not be refused unless the Court is satisfied that the facts disclosed do not indicate any substantial defence or that the defence is frivolous or vexatious."
    status: "in_force"

  - doc_id: "cpc-1908:O38-R5"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "38"
    order_roman: "XXXVIII"
    order_title: "Arrest and Attachment before Judgment"
    rule_number: "5"
    ref: "Order 38 Rule 5"
    ref_norm: "O38-R5"
    title: "Where defendant may be called upon to furnish security for production of property"
    text: "(1) Where, at any stage of a suit, the Court is satisfied, by affidavit or otherwise, that the defendant, with intent to obstruct or delay the execution of any decree that may be passed against him, (a) is about to dispose of the whole or any part of his property, or (b) is about to remove the whole or any part of his property from the local limits of the jurisdiction of the Court, the Court may direct the defendant, within a time to be fixed by it, either to furnish security, in such sum as may be specified in the order, to produce and place at the disposal of the Court the said property or its value, or to appear and show cause why he should not furnish security. (4) If an order of attachment is made without complying with the provisions of sub-rule (1), such attachment shall be void."
    status: "in_force"

  - doc_id: "cpc-1908:O39-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "39"
    order_roman: "XXXIX"
    order_title: "Temporary Injunctions and Interlocutory Orders"
    rule_number: "1"
    ref: "Order 39 Rule 1"
    ref_norm: "O39-R1"
    title: "Cases in which temporary injunction may be granted"
    text: "Where in any suit it is proved by affidavit or otherwise: (a) that any property in dispute in a suit is in danger of being wasted, damaged or alienated by any party to the suit, or wrongfully sold in execution of a decree, or (b) that the defendant threatens, or intends, to remove or dispose of his property with a view to defrauding his creditors, (c) that the defendant threatens to dispossess the plaintiff or otherwise cause injury to the plaintiff in relation to any property in dispute in the suit, the Court may by order grant a temporary injunction to restrain such act, or make such other order for the purpose of staying and preventing the wasting, damaging, alienation, sale, removal or disposition of the property or dispossession of the plaintiff, or otherwise causing injury to the plaintiff."
    status: "in_force"

  - doc_id: "cpc-1908:O39-R2A"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "39"
    order_roman: "XXXIX"
    order_title: "Temporary Injunctions and Interlocutory Orders"
    rule_number: "2A"
    ref: "Order 39 Rule 2A"
    ref_norm: "O39-R2A"
    title: "Consequence of disobedience or breach of injunction"
    text: "(1) In the case of disobedience of any injunction granted or other order made under rule 1 or rule 2 or breach of any of the terms on which the injunction was granted or the order made, the Court granting the injunction or making the order, or any Court to which the suit or proceeding is transferred, may order the property of the person guilty of such disobedience or breach to be attached, and may also order such person to be detained in the civil prison for a term not exceeding three months, unless in the meantime the Court directs his release."
    status: "in_force"

  - doc_id: "cpc-1908:O40-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "40"
    order_roman: "XL"
    order_title: "Appointment of Receivers"
    rule_number: "1"
    ref: "Order 40 Rule 1"
    ref_norm: "O40-R1"
    title: "Appointment of receivers"
    text: "(1) Where it appears to the Court to be just and convenient, the Court may by order: (a) appoint a receiver of any property, whether before or after decree; (b) remove any person from the possession or custody of the property; (c) commit the same to the possession, custody or management of the receiver; and (d) confer upon the receiver all such powers, as to bringing and defending suits and for the realization, management, protection, preservation and improvement of the property, the collection of the rents and profits thereof, the application and disposal of such rents and profits, and the execution of documents as the owner himself has."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "1"
    ref: "Order 41 Rule 1"
    ref_norm: "O41-R1"
    title: "Form of appeal. What to accompany memorandum"
    text: "(1) Every appeal shall be preferred in the form of a memorandum signed by the appellant or his pleader and presented to the Court or to such officer as it appoints in this behalf. The memorandum shall be accompanied by a copy of the judgment. (2) The memorandum shall set forth, concisely and under distinct heads, the grounds of objection to the decree appealed from without any argument or narrative; and such grounds shall be numbered consecutively."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R5"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "5"
    ref: "Order 41 Rule 5"
    ref_norm: "O41-R5"
    title: "Stay by Appellate Court"
    text: "(1) An appeal shall not operate as a stay of proceedings under a decree or order appealed from except so far as the Appellate Court may order, nor shall execution of a decree be stayed by reason only of an appeal having been preferred from the decree; but the Appellate Court may for sufficient cause order stay of execution of such decree upon security and satisfaction of substantial loss criteria."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R27"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "27"
    ref: "Order 41 Rule 27"
    ref_norm: "O41-R27"
    title: "Production of additional evidence in Appellate Court"
    text: "(1) The parties to an appeal shall not be entitled to produce additional evidence, whether oral or documentary, in the Appellate Court. But if (a) the Court from whose decree the appeal is preferred has refused to admit evidence which ought to have been admitted, or (aa) the party seeking to produce additional evidence establishes that notwithstanding the exercise of due diligence, such evidence was not within his knowledge or could not be produced at the time the decree was passed, or (b) the Appellate Court requires any document to be produced or any witness to be examined to enable it to pronounce judgment, or for any other substantial cause, the Appellate Court may allow such evidence or document to be produced."
    status: "in_force"

  - doc_id: "cpc-1908:O42-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "42"
    order_roman: "XLII"
    order_title: "Appeals from Appellate Decrees"
    rule_number: "1"
    ref: "Order 42 Rule 1"
    ref_norm: "O42-R1"
    title: "Procedure (Second Appeals)"
    text: "The rules of Order XLI shall apply, so far as may be, to appeals from appellate decrees (second appeals under section 100 CPC confined to substantial questions of law)."
    status: "in_force"

  - doc_id: "cpc-1908:O43-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "43"
    order_roman: "XLIII"
    order_title: "Appeals from Orders"
    rule_number: "1"
    ref: "Order 43 Rule 1"
    ref_norm: "O43-R1"
    title: "Appeal from orders"
    text: "An appeal shall lie from the following orders under the provisions of section 104, namely: orders returning a plaint under O.7 R.10, rejecting an application to set aside dismissal or ex parte decree (O.9 R.9/R.13), striking out defence (O.11 R.21), setting aside or refusing to set aside sale or adjudication in execution (O.21 R.34/R.72/R.92/R.106), refusing to set aside abatement (O.22 R.9), recording or refusing to record compromise (O.23 R.3), attachment before judgment (O.38 R.2/R.3/R.6), temporary injunctions (O.39 R.1/R.2/R.2A/R.4/R.10), appointment of receiver (O.40 R.1/R.4), remand orders (O.41 R.23/R.23A), and granting review (O.47 R.4)."
    status: "in_force"

  - doc_id: "cpc-1908:O44-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "44"
    order_roman: "XLIV"
    order_title: "Appeals by Indigent Persons"
    rule_number: "1"
    ref: "Order 44 Rule 1"
    ref_norm: "O44-R1"
    title: "Who may appeal as an indigent person"
    text: "Any person entitled to prefer an appeal, who is unable to pay the fee required for the memorandum of appeal, may present an application accompanied by a memorandum of appeal, and may be allowed to appeal as an indigent person, subject, in all matters, including the presentation of such application, to the provisions relating to suits by indigent persons under Order XXXIII, in so far as those provisions are applicable."
    status: "in_force"

  - doc_id: "cpc-1908:O45-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "45"
    order_roman: "XLV"
    order_title: "Appeals to the Supreme Court"
    rule_number: "2"
    ref: "Order 45 Rule 2"
    ref_norm: "O45-R2"
    title: "Application to Court whose decree complained of"
    text: "Whoever desires to appeal to the Supreme Court shall apply by petition to the Court whose decree is complained of, for a certificate under article 132(1), 133(1) or 134A of the Constitution, and the Court shall hear and determine the application for certificate in accordance with rules 3 to 15."
    status: "in_force"

  - doc_id: "cpc-1908:O46-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "46"
    order_roman: "XLVI"
    order_title: "Reference"
    rule_number: "1"
    ref: "Order 46 Rule 1"
    ref_norm: "O46-R1"
    title: "Reference of question to High Court"
    text: "Where, before or on the hearing of a suit or an appeal in which the decree is not subject to appeal, or where, in the execution of any such decree, any question of law or usage having the force of law arises, on which the Court trying the suit or appeal, or executing the decree, entertains reasonable doubt, the Court may, either of its own motion or on the application of any of the parties, draw up a statement of the facts of the case and the point on which doubt is entertained, and refer such statement with its own opinion on the point for the decision of the High Court."
    status: "in_force"

  - doc_id: "cpc-1908:O47-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "47"
    order_roman: "XLVII"
    order_title: "Review"
    rule_number: "1"
    ref: "Order 47 Rule 1"
    ref_norm: "O47-R1"
    title: "Application for review of judgment"
    text: "(1) Any person considering himself aggrieved (a) by a decree or order from which an appeal is allowed, but from which no appeal has been preferred, (b) by a decree or order from which no appeal is allowed, or (c) by a decision on a reference from a Court of Small Causes, and who, from the discovery of new and important matter or evidence which, after the exercise of due diligence was not within his knowledge or could not be produced by him at the time when the decree was passed or order made, or on account of some mistake or error apparent on the face of the record, or for any other sufficient reason, desires to obtain a review of the decree passed or order made against him, may apply for a review of judgment to the Court which passed the decree or made the order."
    status: "in_force"

  - doc_id: "cpc-1908:O48-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "48"
    order_roman: "XLVIII"
    order_title: "Miscellaneous"
    rule_number: "1"
    ref: "Order 48 Rule 1"
    ref_norm: "O48-R1"
    title: "Process to be served at expense of party issuing; costs of service"
    text: "Every process issued under this Code shall be served at the expense of the party on whose behalf it is issued, unless the Court otherwise directs, and rules 2 and 3 govern service of orders/notices and use of forms in the Appendices."
    status: "in_force"

  - doc_id: "cpc-1908:O49-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "49"
    order_roman: "XLIX"
    order_title: "Chartered High Courts"
    rule_number: "1"
    ref: "Order 49 Rule 1"
    ref_norm: "O49-R1"
    title: "Who may serve processes of High Court; saving of Chartered High Court rules"
    text: "Notice to produce documents, summonses to witnesses, and other judicial processes may be served by attorneys or other persons as directed by Chartered High Courts; rule 3 exempts Chartered High Courts in ordinary original civil jurisdiction from specified rules of the First Schedule."
    status: "in_force"

  - doc_id: "cpc-1908:O50-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "50"
    order_roman: "L"
    order_title: "Provincial Small Cause Courts"
    rule_number: "1"
    ref: "Order 50 Rule 1"
    ref_norm: "O50-R1"
    title: "Provincial Small Cause Courts"
    text: "The provisions hereinafter specified shall not extend to Courts constituted under the Provincial Small Cause Courts Act, 1887, or to Courts exercising the jurisdiction of a Court of Small Causes under the said Act, that is to say: so much of this Schedule as relates to suits excepted from Small Cause cognizance, execution against immovable property, settlement of issues, framing of full judgments, and appeals/review."
    status: "in_force"

  - doc_id: "cpc-1908:O51-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "51"
    order_roman: "LI"
    order_title: "Presidency Small Cause Courts"
    rule_number: "1"
    ref: "Order 51 Rule 1"
    ref_norm: "O51-R1"
    title: "Presidency Small Cause Courts"
    text: "Save as provided in rules 22 and 23 of Order V, rules 4 and 7 of Order XXI, and rule 4 of Order XXVI, and by the Presidency Small Cause Courts Act, 1882, this Schedule shall not extend to any suit or proceeding in any Court of Small Causes established in the towns of Calcutta, Madras and Bombay."
    status: "in_force"

  - doc_id: "cpc-1908:O1-R8"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "1"
    order_roman: "I"
    order_title: "Parties to Suits"
    rule_number: "8"
    ref: "Order 1 Rule 8"
    ref_norm: "O1-R8"
    title: "One person may sue or defend on behalf of all in same interest (Representative suit)"
    text: "(1) Where there are numerous persons having the same interest in one suit, (a) one or more of such persons may, with the permission of the Court, sue or be sued, or may defend such suit, on behalf of, or for the benefit of, all persons so interested; (b) the Court may direct that one or more of such persons may sue or be sued on behalf of all persons so interested, after giving notice by personal service or public advertisement."
    status: "in_force"

  - doc_id: "cpc-1908:O2-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "2"
    order_roman: "II"
    order_title: "Frame of Suit"
    rule_number: "3"
    ref: "Order 2 Rule 3"
    ref_norm: "O2-R3"
    title: "Joinder of causes of action"
    text: "(1) Save as otherwise provided, a plaintiff may unite in the same suit several causes of action against the same defendant, or the same defendants jointly; and any plaintiffs having causes of action in which they are jointly interested against the same defendant or the same defendants jointly may unite such causes of action in the same suit."
    status: "in_force"

  - doc_id: "cpc-1908:O6-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "6"
    order_roman: "VI"
    order_title: "Pleadings Generally"
    rule_number: "2"
    ref: "Order 6 Rule 2"
    ref_norm: "O6-R2"
    title: "Pleading to state material facts and not evidence"
    text: "(1) Every pleading shall contain, and contain only, a statement in a concise form of the material facts on which the party pleading relies for his claim or defence, as the case may be, but not the evidence by which they are to be proved."
    status: "in_force"

  - doc_id: "cpc-1908:O6-R16"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "6"
    order_roman: "VI"
    order_title: "Pleadings Generally"
    rule_number: "16"
    ref: "Order 6 Rule 16"
    ref_norm: "O6-R16"
    title: "Striking out pleadings"
    text: "The Court may at any stage of the proceedings order to be struck out or amended any matter in any pleading (a) which may be unnecessary, scandalous, frivolous or vexatious, or (b) which may tend to prejudice, embarrass or delay the fair trial of the suit, or (c) which is otherwise an abuse of the process of the Court."
    status: "in_force"

  - doc_id: "cpc-1908:O7-R7"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "7"
    order_roman: "VII"
    order_title: "Plaint"
    rule_number: "7"
    ref: "Order 7 Rule 7"
    ref_norm: "O7-R7"
    title: "Relief to be specifically stated"
    text: "Every plaint shall state specifically the relief which the plaintiff claims either simply or in the alternative, and it shall not be necessary to ask for general or other relief which may always be given as the Court may think just to the same extent as if it had been asked for."
    status: "in_force"

  - doc_id: "cpc-1908:O7-R14"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "7"
    order_roman: "VII"
    order_title: "Plaint"
    rule_number: "14"
    ref: "Order 7 Rule 14"
    ref_norm: "O7-R14"
    title: "Production of document on which plaintiff sues or relies"
    text: "(1) Where a plaintiff sues upon a document or relies upon document in his possession or power in support of his claim, he shall enter such documents in a list, and shall produce it in Court when the plaint is presented by him and shall, at the same time deliver the document and a copy thereof, to be filed with the plaint. (3) A document which ought to be produced in Court by the plaintiff when the plaint is presented, or to be entered in the list to be added or annexed to the plaint but is not produced or entered accordingly, shall not, without the leave of the Court, be received in evidence on his behalf at the hearing of the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O8-R5"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "8"
    order_roman: "VIII"
    order_title: "Written Statement, Set-Off and Counter-Claim"
    rule_number: "5"
    ref: "Order 8 Rule 5"
    ref_norm: "O8-R5"
    title: "Specific denial"
    text: "(1) Every allegation of fact in the plaint, if not denied specifically or by necessary implication, or stated to be not admitted in the pleading of the defendant, shall be taken to be admitted except as against a person under disability: Provided that the Court may in its discretion require any fact so admitted to be proved otherwise than by such admission."
    status: "in_force"

  - doc_id: "cpc-1908:O8-R10"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "8"
    order_roman: "VIII"
    order_title: "Written Statement, Set-Off and Counter-Claim"
    rule_number: "10"
    ref: "Order 8 Rule 10"
    ref_norm: "O8-R10"
    title: "Procedure when party fails to present written statement called for by Court"
    text: "Where any party from whom a written statement is required under rule 1 or rule 9 fails to present the same within the time permitted or fixed by the Court, as the case may be, the Court shall pronounce judgment against him, or make such order in relation to the suit as it thinks fit and on the pronouncement of such judgment a decree shall be drawn up."
    status: "in_force"

  - doc_id: "cpc-1908:O9-R8"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "9"
    order_roman: "IX"
    order_title: "Appearance of Parties and Consequence of Non-Appearance"
    rule_number: "8"
    ref: "Order 9 Rule 8"
    ref_norm: "O9-R8"
    title: "Procedure where defendant only appears"
    text: "Where the defendant appears and the plaintiff does not appear when the suit is called on for hearing, the Court shall make an order that the suit be dismissed, unless the defendant admits the claim, or part thereof, in which case the Court shall pass a decree against the defendant upon such admission, and where part only of the claim has been admitted, shall dismiss the suit so far as it relates to the remainder."
    status: "in_force"

  - doc_id: "cpc-1908:O9-R9"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "9"
    order_roman: "IX"
    order_title: "Appearance of Parties and Consequence of Non-Appearance"
    rule_number: "9"
    ref: "Order 9 Rule 9"
    ref_norm: "O9-R9"
    title: "Decree against plaintiff by default bars fresh suit"
    text: "(1) Where a suit is wholly or partly dismissed under rule 8, the plaintiff shall be precluded from bringing a fresh suit in respect of the same cause of action. But he may apply for an order to set the dismissal aside, and if he satisfies the Court that there was sufficient cause for his non-appearance when the suit was called on for hearing, the Court shall make an order setting aside the dismissal upon such terms as to costs or otherwise as it thinks fit."
    status: "in_force"

  - doc_id: "cpc-1908:O11-R12"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "11"
    order_roman: "XI"
    order_title: "Discovery and Inspection"
    rule_number: "12"
    ref: "Order 11 Rule 12"
    ref_norm: "O11-R12"
    title: "Application for discovery of documents"
    text: "Any party may, without filing any affidavit, apply to the Court for an order directing any other party to any suit to make discovery on oath of the documents which are or have been in his possession or power, relating to any matter in question therein."
    status: "in_force"

  - doc_id: "cpc-1908:O11-R21"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "11"
    order_roman: "XI"
    order_title: "Discovery and Inspection"
    rule_number: "21"
    ref: "Order 11 Rule 21"
    ref_norm: "O11-R21"
    title: "Non-compliance with order for discovery"
    text: "(1) Where any party fails to comply with any order to answer interrogatories, or for discovery or inspection of documents, he shall, if a plaintiff, be liable to have his suit dismissed for want of prosecution, and, if a defendant, to have his defence, if any, struck out, and to be placed in the same position as if he had not defended."
    status: "in_force"

  - doc_id: "cpc-1908:O12-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "12"
    order_roman: "XII"
    order_title: "Admissions"
    rule_number: "1"
    ref: "Order 12 Rule 1"
    ref_norm: "O12-R1"
    title: "Notice of admission of case"
    text: "Any party to a suit may give notice, by his pleading, or otherwise in writing, that he admits the truth of the whole or any part of the case of any other party."
    status: "in_force"

  - doc_id: "cpc-1908:O13-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "13"
    order_roman: "XIII"
    order_title: "Production, Impounding and Return of Documents"
    rule_number: "3"
    ref: "Order 13 Rule 3"
    ref_norm: "O13-R3"
    title: "Rejection of irrelevant or inadmissible documents"
    text: "The Court may at any stage of the suit reject any document which it considers irrelevant or otherwise inadmissible, recording the grounds of such rejection."
    status: "in_force"

  - doc_id: "cpc-1908:O18-R17"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "18"
    order_roman: "XVIII"
    order_title: "Hearing of the Suit and Examination of Witnesses"
    rule_number: "17"
    ref: "Order 18 Rule 17"
    ref_norm: "O18-R17"
    title: "Court may recall and examine witness"
    text: "The Court may at any stage of a suit recall any witness who has been examined and may (subject to the law of evidence for the time being in force) put such questions to him as the Court thinks fit."
    status: "in_force"

  - doc_id: "cpc-1908:O20-R12"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "20"
    order_roman: "XX"
    order_title: "Judgment and Decree"
    rule_number: "12"
    ref: "Order 20 Rule 12"
    ref_norm: "O20-R12"
    title: "Decree for possession and mesne profits"
    text: "(1) Where a suit is for the recovery of possession of immovable property and for rent or mesne profits, the Court may pass a decree (a) for the possession of the property; (b) for the rents which have accrued on the property during the period prior to the institution of the suit or directing an inquiry as to such rent; (ba) for the mesne profits or directing an inquiry as to such mesne profits; (c) directing an inquiry as to rent or mesne profits from the institution of the suit until delivery of possession or expiration of three years from date of decree."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R10"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "10"
    ref: "Order 21 Rule 10"
    ref_norm: "O21-R10"
    title: "Application for execution"
    text: "Where the holder of a decree desires to execute it, he shall apply to the Court which passed the decree or to the officer (if any) appointed in this behalf, or if the decree has been sent under the provisions hereinbefore contained to another Court, then to such Court or to the proper officer thereof."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R22"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "22"
    ref: "Order 21 Rule 22"
    ref_norm: "O21-R22"
    title: "Notice to show cause against execution in certain cases"
    text: "(1) Where an application for execution is made (a) more than two years after the date of the decree, or (b) against the legal representative of a party to the decree, or (c) against the assignee or receiver in insolvency, the Court executing the decree shall issue a notice to the person against whom execution is applied for requiring him to show cause why the decree should not be executed against him."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R58"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "58"
    ref: "Order 21 Rule 58"
    ref_norm: "O21-R58"
    title: "Adjudication of claims to, or objections to attachment of, property"
    text: "(1) Where any claim is preferred to, or any objection is made to the attachment of, any property attached in execution of a decree on the ground that such property is not liable to such attachment, the Court shall proceed to adjudicate upon the claim or objection in accordance with the provisions herein contained. (2) All questions including questions relating to right, title or interest in the property attached arising between the parties to a proceeding or their representatives under this rule and relevant to the adjudication of the claim or objection, shall be determined by the Court dealing with the claim or objection and not by a separate suit."
    status: "in_force"

  - doc_id: "cpc-1908:O21-R90"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "21"
    order_roman: "XXI"
    order_title: "Execution of Decrees and Orders"
    rule_number: "90"
    ref: "Order 21 Rule 90"
    ref_norm: "O21-R90"
    title: "Application to set aside sale on ground of irregularity or fraud"
    text: "(1) Where any immovable property has been sold in execution of a decree, the decree-holder, or the purchaser, or any other person entitled to share in a rateable distribution of assets, or whose interests are affected by the sale, may apply to the Court to set aside the sale on the ground of a material irregularity or fraud in publishing or conducting it: Provided that no sale shall be set aside unless upon the facts proved, the Court is satisfied that the applicant has sustained substantial injury by reason of such irregularity or fraud."
    status: "in_force"

  - doc_id: "cpc-1908:O22-R9"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "22"
    order_roman: "XXII"
    order_title: "Death, Marriage and Insolvency of Parties"
    rule_number: "9"
    ref: "Order 22 Rule 9"
    ref_norm: "O22-R9"
    title: "Effect of abatement or dismissal"
    text: "(1) Where a suit abates or is dismissed under this Order, no fresh suit shall be brought on the same cause of action. (2) The plaintiff or the person claiming to be the legal representative of a deceased plaintiff or the assignee or the receiver in the case of an insolvent plaintiff may apply for an order to set aside the abatement or dismissal; and if it is proved that he was prevented by any sufficient cause from continuing the suit, the Court shall set aside the abatement or dismissal upon such terms as to costs or otherwise as it thinks fit."
    status: "in_force"

  - doc_id: "cpc-1908:O22-R10"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "22"
    order_roman: "XXII"
    order_title: "Death, Marriage and Insolvency of Parties"
    rule_number: "10"
    ref: "Order 22 Rule 10"
    ref_norm: "O22-R10"
    title: "Procedure in case of assignment before final order in suit"
    text: "(1) In other cases of an assignment, creation or devolution of any interest during the pendency of a suit, the suit may, by leave of the Court, be continued by or against the person to or upon whom such interest has come or devolved."
    status: "in_force"

  - doc_id: "cpc-1908:O26-R1"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "26"
    order_roman: "XXVI"
    order_title: "Commissions"
    rule_number: "1"
    ref: "Order 26 Rule 1"
    ref_norm: "O26-R1"
    title: "Cases in which Court may issue commission to examine witness"
    text: "Any Court may in any suit issue a commission for the examination on interrogatories or otherwise of any person resident within the local limits of its jurisdiction who is exempted under this Code from attending the Court or who is from sickness or infirmity unable to attend it."
    status: "in_force"

  - doc_id: "cpc-1908:O32-R7"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "32"
    order_roman: "XXXII"
    order_title: "Suits by or against Minors and Persons of Unsound Mind"
    rule_number: "7"
    ref: "Order 32 Rule 7"
    ref_norm: "O32-R7"
    title: "Agreement or compromise by next friend or guardian for the suit"
    text: "(1) No next friend or guardian for the suit shall, without the leave of the Court, expressly recorded in the proceedings, enter into any agreement or compromise on behalf of a minor with reference to the suit in which he acts as next friend or guardian. (2) Any such agreement or compromise entered into without the leave of the Court so recorded shall be voidable against all parties other than the minor."
    status: "in_force"

  - doc_id: "cpc-1908:O33-R5"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "33"
    order_roman: "XXXIII"
    order_title: "Suits by Indigent Persons"
    rule_number: "5"
    ref: "Order 33 Rule 5"
    ref_norm: "O33-R5"
    title: "Rejection of application for permission to sue as an indigent person"
    text: "The Court shall reject an application for permission to sue as an indigent person where it is not framed and presented in the manner prescribed, where the applicant is not an indigent person, where he has fraudulently disposed of property within two months before presentation, where his allegations do not show a cause of action, where he has entered into an agreement transferring interest in the subject-matter, where the suit appears barred by any law, or where any other person has agreed to finance the litigation."
    status: "in_force"

  - doc_id: "cpc-1908:O37-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "37"
    order_roman: "XXXVII"
    order_title: "Summary Procedure"
    rule_number: "2"
    ref: "Order 37 Rule 2"
    ref_norm: "O37-R2"
    title: "Institution of summary suits"
    text: "(1) A suit, to which this Order applies, may if the plaintiff desires to proceed hereunder, be instituted by presenting a plaint which shall contain a specific averment that the suit is filed under this Order and that no relief outside its scope has been claimed. (3) The defendant shall not defend the suit unless he enters an appearance and in default of his entering an appearance the allegations in the plaint shall be deemed to be admitted and the plaintiff shall be entitled to a decree."
    status: "in_force"

  - doc_id: "cpc-1908:O39-R2"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "39"
    order_roman: "XXXIX"
    order_title: "Temporary Injunctions and Interlocutory Orders"
    rule_number: "2"
    ref: "Order 39 Rule 2"
    ref_norm: "O39-R2"
    title: "Injunction to restrain repetition or continuance of breach"
    text: "(1) In any suit for restraining the defendant from committing a breach of contract or other injury of any kind, whether compensation is claimed in the suit or not, the plaintiff may, at any time after the commencement of the suit, and either before or after judgment, apply to the Court for a temporary injunction to restrain the defendant from committing the breach of contract or injury complained of."
    status: "in_force"

  - doc_id: "cpc-1908:O39-R3"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "39"
    order_roman: "XXXIX"
    order_title: "Temporary Injunctions and Interlocutory Orders"
    rule_number: "3"
    ref: "Order 39 Rule 3"
    ref_norm: "O39-R3"
    title: "Before granting injunction, Court to direct notice to opposite party"
    text: "The Court shall in all cases, except where it appears that the object of granting the injunction would be defeated by the delay, before granting an injunction, direct notice of the application for the same to be given to the opposite party: Provided that where it is proposed to grant an injunction without giving notice to the opposite party, the Court shall record the reasons for its opinion that the object of granting the injunction would be defeated by delay."
    status: "in_force"

  - doc_id: "cpc-1908:O39-R4"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "39"
    order_roman: "XXXIX"
    order_title: "Temporary Injunctions and Interlocutory Orders"
    rule_number: "4"
    ref: "Order 39 Rule 4"
    ref_norm: "O39-R4"
    title: "Order for injunction may be discharged, varied or set aside"
    text: "Any order for an injunction may be discharged, or varied, or set aside by the Court, on application made thereto by any party dissatisfied with such order: Provided that if in an application for temporary injunction or in any affidavit supporting such application, a party has knowingly made a false or misleading statement in relation to a material particular and the injunction was granted without giving notice to the opposite party, the Court shall vacate the injunction unless for reasons to be recorded it considers that it is not necessary so to do in the interests of justice."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R22"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "22"
    ref: "Order 41 Rule 22"
    ref_norm: "O41-R22"
    title: "Upon hearing respondent may object to decree as if he had preferred separate appeal (Cross-objections)"
    text: "(1) Any respondent, though he may not have appealed from any part of the decree, may not only support the decree but may also state that the finding against him in the Court below in respect of any issue ought to have been in his favour; and may also take any cross-objection to the decree which he could have taken by way of appeal, provided he has filed such objection in the Appellate Court within one month from the date of service on him or his pleader of notice of the day fixed for hearing the appeal."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R23"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "23"
    ref: "Order 41 Rule 23"
    ref_norm: "O41-R23"
    title: "Remand of case by Appellate Court"
    text: "Where the Court from whose decree an appeal is preferred has disposed of the suit upon a preliminary point and the decree is reversed in appeal, the Appellate Court may, if it thinks fit, by order remand the case, and may further direct what issue or issues shall be tried in the case so remanded, and shall send a copy of its judgment and order to the Court from whose decree the appeal is preferred, with directions to re-admit the suit under its original number in the register of civil suits, and proceed to determine the suit."
    status: "in_force"

  - doc_id: "cpc-1908:O41-R33"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "41"
    order_roman: "XLI"
    order_title: "Appeals from Original Decrees"
    rule_number: "33"
    ref: "Order 41 Rule 33"
    ref_norm: "O41-R33"
    title: "Power of Court of Appeal"
    text: "The Appellate Court shall have power to pass any decree and make any order which ought to have been passed or made and to pass or make such further or other decree or order as the case may require, and this power may be exercised by the Court notwithstanding that the appeal is as to part only of the decree and may be exercised in favour of all or any of the respondents or parties, although such respondents or parties may not have filed any appeal or objection."
    status: "in_force"

  - doc_id: "cpc-1908:O47-R4"
    act_id: "cpc-1908"
    act_short: "CPC"
    kind: "order_rule"
    order_number: "47"
    order_roman: "XLVII"
    order_title: "Review"
    rule_number: "4"
    ref: "Order 47 Rule 4"
    ref_norm: "O47-R4"
    title: "Application where rejected or granted"
    text: "(1) Where it appears to the Court that there is not sufficient ground for a review, it shall reject the application. (2) Where the Court is of opinion that the application for review should be granted, it shall grant the same: Provided that no such application shall be granted without previous notice to the opposite party, to enable him to appear and be heard in support of the decree or order, a review of which is applied for."
    status: "in_force"

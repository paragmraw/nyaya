  act_short: Constitution
  kind: article
  ref: '136'
  ref_norm: '136'
  chapter_num: null
  chapter_title: The Union Judiciary
  part: Part V - The Union
  title: Special leave to appeal by the Supreme Court
  text: '(1) Notwithstanding anything in this Chapter, the Supreme Court may, in its discretion, grant special leave to appeal
    from any judgment, decree, determination, sentence or order in any cause or matter passed or made by any court or tribunal
    in the territory of India.


    (2) Nothing in clause (1) shall apply to any judgment, determination, sentence or order passed or made by any court or
    tribunal constituted by or under any law relating to the Armed Forces.'

- doc_id: contract-act-1872:73
  act_id: contract-act-1872
  act_short: ContractAct
  kind: section
  ref: '73'
  ref_norm: '73'
  chapter_num: VI
  chapter_title: OF THE CONSEQUENCES OF BREACH OF CONTRACT
  part: null
  title: Compensation for loss or damage caused by breach of contract
  text: 'When a contract has been broken, the party who suffers by such breach is entitled to receive, from the party who
    has broken the contract, compensation for any loss or damage caused to him thereby, which naturally arose in the usual
    course of things from such breach, or which the parties knew, when they made the contract, to be likely to result from
    the breach of it.


    Such compensation is not to be given for any remote and indirect loss or damage sustained by reason of the breach.


    Compensation for failure to discharge obligation resembling those created by contract.—When an obligation resembling those
    created by contract has been incurred and has not been discharged, any person injured by the failure to discharge it is
    entitled to receive the same compensation from the party in default, as if such person had contracted to discharge it
    and had broken his contract.


    Explanation.—In estimating the loss or damage arising from a breach of contract, the means which existed of remedying
    the inconvenience caused by the non-performance of the contract must be taken into account.


    Illustrations:

    (a) A contracts to sell and deliver 50 maunds of saltpetre to B, at a certain price to be paid on delivery. A breaks his
    promise. B is entitled to receive from A, by way of compensation, the sum, if any, by which the contract price falls short
    of the price for which B might have obtained 50 maunds of saltpetre of like quality at the time when the saltpetre ought
    to have been delivered.

    (b) A hires B''s ship to go to Bombay, and there take on board, on the first of January, a cargo, which A is to provide,
    and to bring it to Calcutta, the freight to be paid when earned. B''s ship does not go to Bombay, but A has opportunities
    of procuring suitable conveyance for the cargo upon terms as advantageous as those on which he had chartered the ship.
    A avails himself of those opportunities, but is put to trouble and expense in doing so. A is entitled to receive compensation
    from B in respect of such trouble and expense.

    (f) A contracts to repair B''s house in a certain manner, and receives payment in advance. A repairs the house, but not
    according to contract. B is entitled to recover from A the cost of making the repairs conform to the contract.

    (i) A delivers to B, a common carrier, a machine, to be conveyed, without delay, to A''s mill informing B that his mill
    is stopped for want of the machine. B unreasonably delays the delivery of the machine, and A, in consequence, loses a
    profitable contract with the Government. A is entitled to receive from B, by way of compensation, the average amount of
    profit which would have been made by the working of the mill during the time that delivery of it was delayed, but not
    the loss sustained through the loss of the Government contract.'

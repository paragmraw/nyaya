- doc_id: it-act-2000:66A
  act_id: it-act-2000
  act_short: ITAct
  kind: section
  ref: 66A
  ref_norm: 66A
  chapter_num: XI
  chapter_title: OFFENCES
  part: null
  title: Punishment for sending offensive messages through communication service, etc.
  text: 'Any person who sends, by means of a computer resource or a communication device,—

    (a) any information that is grossly offensive or has menacing character; or

    (b) any information which he knows to be false, but for the purpose of causing annoyance, inconvenience, danger, obstruction,
    insult, injury, criminal intimidation, enmity, hatred or ill will, persistently by making use of such computer resource
    or a communication device;

    (c) any electronic mail or electronic mail message for the purpose of causing annoyance or inconvenience or to deceive
    or to mislead the addressee or recipient about the origin of such messages,

    shall be punishable with imprisonment for a term which may extend to three years and with fine.


    Explanation.—For the purposes of this section, terms "electronic mail" and "electronic mail message" means a message or
    information created or transmitted or received on a computer, computer system, computer resource or communication device
    including attachments in text, image, audio, video and any other electronic record, which may be transmitted with the
    message.'

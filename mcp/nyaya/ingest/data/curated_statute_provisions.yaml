- doc_id: cpc-1908:O7-R11
  act_id: cpc-1908
  act_short: CPC
  kind: order_rule
  ref: Order 7 Rule 11
  ref_norm: O7-R11
  chapter_num: First Schedule
  chapter_title: Orders and Rules
  part: null
  title: Rejection of plaint
  text: 'The plaint shall be rejected in the following cases:—

    (a) where it does not disclose a cause of action;

    (b) where the relief claimed is undervalued, and the plaintiff, on being required by the Court to correct the valuation
    within a time to be fixed by the Court, fails to do so;

    (c) where the relief claimed is properly valued, but the plaint is returned upon paper insufficiently stamped, and the
    plaintiff, on being required by the Court to supply the requisite stamp-paper within a time to be fixed by the Court,
    fails to do so;

    (d) where the suit appears from the statement in the plaint to be barred by any law;

    (e) where it is not filed in duplicate;

    (f) where the plaintiff fails to comply with the provisions of rule 9:


    Provided that the time fixed by the Court for the correction of the valuation or supplying of the requisite stamp-paper
    shall not be extended unless the Court, for reasons to be recorded, is satisfied that the plaintiff was prevented by any
    cause of an exceptional nature from correcting the valuation or supplying the requisite stamp-paper, as the case may be,
    within the time fixed by the Court and that refusal to extend such time would cause grave injustice to the plaintiff.'

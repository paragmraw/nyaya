- doc_id: constitution:art:32
  act_id: constitution
  act_short: Constitution
  kind: article
  ref: '32'
  ref_norm: '32'
  chapter_num: null
  chapter_title: Right to Constitutional Remedies
  part: Part III - Fundamental Rights
  title: Remedies for enforcement of rights conferred by this Part
  text: '(1) The right to move the Supreme Court by appropriate proceedings for the enforcement of the rights conferred by
    this Part is guaranteed.


    (2) The Supreme Court shall have power to issue directions or orders or writs, including writs in the nature of habeas
    corpus, mandamus, prohibition, quo warranto and certiorari, whichever may be appropriate, for the enforcement of any of
    the rights conferred by this Part.


    (3) Without prejudice to the powers conferred on the Supreme Court by clauses (1) and (2), Parliament may by law empower
    any other court to exercise within the local limits of its jurisdiction all or any of the powers exercisable by the Supreme
    Court under clause (2).


    (4) The right guaranteed by this article shall not be suspended except as otherwise provided for by this Constitution.'
  status: in_force
  commencement_date: '1950-01-26'
  repeal_date: null
  source_id: legislative_constitution
  source_url: https://legislative.gov.in/sites/default/files/COI_2026.pdf

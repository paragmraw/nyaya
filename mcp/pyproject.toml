[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyaya"
version = "0.2.0"
description = "MCP server for Indian law: Constitution, IPC, CrPC, CPC, Evidence Act, BNS/BNSS/BSA 2023, commercial statutes, and landmark Supreme Court judgments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "nyaya contributors" }]
keywords = ["mcp", "indian-law", "constitution", "ipc", "crpc", "bns", "legal"]

dependencies = [
    "fastmcp>=2.13.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.5.0,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "openai>=1.0,<2",
    "PyYAML>=6.0,<7",
    "typing-extensions>=4.12,<5",
    "cachetools>=5.5,<7",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
]
# Optional .env loading (get_settings() reads a local .env when NYAYA_DOTENV=1).
dotenv = [
    "python-dotenv>=1.0,<2",
]

[project.urls]
Repository = "https://github.com/your-org/nyaya"
Issues = "https://github.com/your-org/nyaya/issues"

[project.scripts]
nyaya = "nyaya.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nyaya"]

[tool.pytest.ini_options]
# Tests live under mcp/tests/ but pytest may be invoked from the repo root
# or from mcp/. Listing both keeps `pytest` working from either location.
testpaths = ["tests", "mcp/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]
markers = [
    "integration: requires a live Supabase/database connection",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["nyaya"]
omit = ["*/tests/*"]

# Shared-dependency alignment with chat/uv.lock (see the matching block in
# chat/pyproject.toml). The Docker image installs mcp's exported pins first,
# then chat's exported lock *constrained by* mcp's requirements
# (-c requirements.txt), so any shared-pin disagreement between the two locks
# fails the image build loudly instead of silently re-pinning. packaging is
# the one package where the resolver direction goes chat-first: the langfuse
# extra (langfuse>=2,<4) caps packaging at <26 in chat's lock, so mcp pins
# 25.0 here rather than pulling chat up to 26.2.
[tool.uv]
constraint-dependencies = [
    "packaging==25.0",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The hydration notebook is data-prep scratch code (its own cell style);
# linting it only produces noise, so it is excluded from `ruff check .`.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["no-any-return"]

# The former ``nyaya.db`` override (disable_error_code = arg-type,
# call-overload, index, assignment, attr-defined) was removed in the Task 11
# mypy tightening: the 28 suppressed errors were real typing debt, fixed by
# parameterising the pool/connection generics with the dict row factory
# (see ``db._conn`` / ``db._pool``).

[[tool.mypy.overrides]]
module = "cachetools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

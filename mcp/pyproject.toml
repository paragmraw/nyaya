[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyaya"
version = "0.1.0"
description = "MCP server for Indian law: Constitution, IPC, CrPC, CPC, Evidence Act, BNS/BNSS/BSA 2023, commercial statutes, and landmark Supreme Court judgments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "nyaya contributors" }]
keywords = ["mcp", "indian-law", "constitution", "ipc", "crpc", "bns", "legal"]

dependencies = [
    "fastmcp>=2.13.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pgvector>=0.5.0,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "typing-extensions>=4.12,<5",
    "cachetools>=5.5,<7",
]

[project.optional-dependencies]
ingest = [
    "datasets>=2.20,<4",
    "pypdf>=4.0,<5",
    "beautifulsoup4>=4.12,<5",
    "indianconstitution>=1.3,<2",
    "tqdm>=4.66,<5",
]
semantic = [
    "fastembed>=0.3.0,<0.6",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[project.urls]
Repository = "https://github.com/your-org/nyaya"
Issues = "https://github.com/your-org/nyaya/issues"

[project.scripts]
nyaya = "nyaya.server:main"
nyaya-ingest = "nyaya.scripts.ingest_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nyaya"]

[tool.pytest.ini_options]
# Tests live under mcp/tests/ but pytest may be invoked from the repo root
# or from mcp/. Listing both keeps `pytest` working from either location.
testpaths = ["tests", "mcp/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live Supabase/database connection",
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]